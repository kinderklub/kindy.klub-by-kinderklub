    async function hashPassword(password, salt) {
      const enc = new TextEncoder();
      const data = enc.encode(salt + "::kindyklub::" + password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function generateRandomSalt() {
      const arr = new Uint8Array(12);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function generateFriendlyPassword() {
      const adjectives = ["Happy", "Magic", "Sunny", "Super", "Starry", "Brave", "Joyful", "Clever"];
      const nouns = ["Dragon", "Castle", "Panda", "Spark", "Wizard", "Crown", "Rocket", "Rainbow"];
      const num = Math.floor(100 + Math.random() * 900);
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      return `${adj}${noun}${num}!`;
    }

      return `kk-${clean || "star"}-${num}`;

        if (!item) return [];
        const parsed = JSON.parse(item);

        return parsed.filter(entry => !LEGACY_SAMPLE_IDS.has(entry.id));

        const b = Math.floor(Math.random() * 5) + 1;
        const ans = a + b;
        setProblem({ a, b, answer: ans });

        const options = [ans];
        while (options.length < 4) {
          const fake = Math.floor(Math.random() * 12) + 1;
          if (!options.includes(fake)) options.push(fake);
        }
        options.sort(() => Math.random() - 0.5);
        setBalloons(options);
      };

      useEffect(() => {
        generateRound();
      }, []);

      const handlePop = (val) => {
        if (val === problem.answer) {
          setScore(s => s + 10);
          setFeedback("Magnificent! Correct answer! +10 Points");
          setTimeout(() => {
            setFeedback("Pop the next balloon!");
            generateRound();
          }, 900);
        } else {
          setFeedback("Oops, try another balloon! You can do it!");
        }
      };

      return (
        <div className="h-full flex flex-col items-center justify-between p-6 bg-gradient-to-b from-[#AEE9F3] via-[#D7BDED] to-[#ff68bd]/40 select-none text-slate-800 rounded-3xl">
          <div className="flex justify-between w-full max-w-lg bg-white/95 backdrop-blur rounded-2xl px-6 py-3 shadow-md border-3 border-[#07bdff]">
            <div className="font-heading text-lg font-bold text-[#E9285F]">Score: {score}</div>
            <div className="text-sm font-extrabold text-[#00c69e] flex items-center gap-1.5">
              <Icon name="crown" className="w-5 h-5 text-[#f5e45f]" /> Royal Math Star
            </div>
          </div>

          <div className="my-auto text-center">
            <div className="bg-white/95 rounded-3xl p-8 shadow-2xl border-4 border-[#E1F011] max-w-md mx-auto">
              <div className="text-xs uppercase tracking-wider text-[#a890ff] font-extrabold mb-2">Solve the Royal Riddle</div>
              <div className="font-heading text-5xl font-bold text-slate-900 tracking-wide mb-4">
                {problem.a} + {problem.b} = ?
              </div>
              <p className="font-extrabold text-[#fd7a39] h-6 transition-all flex items-center justify-center gap-1.5">
                {feedback.includes("Magnificent") && <Icon name="star" className="w-4 h-4 text-[#f5e45f]" />}
                <span>{feedback}</span>
              </p>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 max-w-md mx-auto">
              {balloons.map((val, idx) => {
                const balloonStyles = [
                  "bg-[#FD60C7] border-white shadow-3d-hotpink text-white",
                  "bg-[#07bdff] border-white shadow-3d-sky text-white",
                  "bg-[#a6e23d] border-white shadow-3d-lime text-slate-900",
                  "bg-[#fd7a39] border-white shadow-3d-orange text-white",
                ];
                return (
                  <button
                    key={idx}
                    onClick={() => handlePop(val)}
                    className={`aspect-square w-20 sm:w-24 rounded-full font-heading text-3xl font-bold border-3 ${balloonStyles[idx % balloonStyles.length]} flex items-center justify-center transform hover:scale-110 active:scale-95 transition-all mx-auto`}
                  >
                    {val}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="text-xs text-slate-700 font-extrabold tracking-wide">Kindy Klub Interactive Game Portal</div>
        </div>
      );
    };

    const CHILD_AVATARS = [
      { id: 'star', label_ms: 'Bintang', label_en: 'Star', icon: 'star', bg: 'bg-[#f5e45f]', text: 'text-slate-900', border: 'border-[#f5e45f]' },
      { id: 'crown', label_ms: 'Mahkota', label_en: 'Crown', icon: 'crown', bg: 'bg-[#FD60C7]', text: 'text-white', border: 'border-[#FD60C7]' },
      { id: 'gamepad', label_ms: 'Arked', label_en: 'Arcade', icon: 'gamepad', bg: 'bg-[#07bdff]', text: 'text-white', border: 'border-[#07bdff]' },
      { id: 'wand', label_ms: 'Magis', label_en: 'Magic', icon: 'wand', bg: 'bg-[#00c69e]', text: 'text-white', border: 'border-[#00c69e]' },
      { id: 'castle', label_ms: 'Istana', label_en: 'Castle', icon: 'castle', bg: 'bg-[#a890ff]', text: 'text-white', border: 'border-[#a890ff]' },
      { id: 'world', label_ms: 'Dunia', label_en: 'World', icon: 'world', bg: 'bg-[#fd7a39]', text: 'text-white', border: 'border-[#fd7a39]' },
      { id: 'heart', label_ms: 'Sayang', label_en: 'Heart', icon: 'heart', bg: 'bg-[#ff68bd]', text: 'text-white', border: 'border-[#ff68bd]' },
      { id: 'sparkles', label_ms: 'Kilau', label_en: 'Sparkle', icon: 'sparkles', bg: 'bg-[#E1F011]', text: 'text-slate-900', border: 'border-[#E1F011]' },
    ];

    // MAIN REACT APP
    function KindyKlubApp() {
      const [lang, setLang] = useState(() => localStorage.getItem("kindy_lang_choice") || "ms");
      const t = TRANSLATIONS[lang] || TRANSLATIONS.ms;

      useEffect(() => {
        localStorage.setItem("kindy_lang_choice", lang);
      }, [lang]);

      const [categories, setCategories] = useState(() => getCleanStorage("kindy_categories_v3"));
      const [games, setGames] = useState(() => getCleanStorage("kindy_games_v3"));
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem("kindy_users_v3");
        return saved ? JSON.parse(saved) : [];
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("kindy_current_user_v3");
        return saved ? JSON.parse(saved) : null;
      });

      const [cloudConfig, setCloudConfig] = useState(() => {
        try {
          const saved = localStorage.getItem("kindy_cloud_config_v1");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.url && parsed.anonKey) return parsed;
          }
        } catch(e) {}
        return {
          url: SUPABASE_PROJECT_URL,
          anonKey: SUPABASE_PUBLISHABLE_KEY,
          isConnected: true
        };
      });
      const [cloudStatus, setCloudStatus] = useState("connected");

      useEffect(() => {
        const activeUrl = (cloudConfig.url || SUPABASE_PROJECT_URL).trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const activeKey = (cloudConfig.anonKey || SUPABASE_PUBLISHABLE_KEY).trim();

        if (activeUrl && activeKey) {
          const fetchSupabase = async () => {
            try {
              const headers = buildSupabaseHeaders(activeKey);

              const resCat = await fetch(`${activeUrl}/rest/v1/categories?select=*&order=display_order.asc`, { headers });
              if (resCat.ok) {
                const catData = await resCat.json();
                if (Array.isArray(catData)) setCategories(catData);
              }

              const resGames = await fetch(`${activeUrl}/rest/v1/games?select=*&order=display_order.asc`, { headers });
              if (resGames.ok) {
                const gameData = await resGames.json();
                if (Array.isArray(gameData)) setGames(gameData);
              }

              const resUsers = await fetch(`${activeUrl}/rest/v1/profiles?select=*`, { headers });
              if (resUsers.ok) {
                const userData = await resUsers.json();
                if (Array.isArray(userData) && userData.length > 0) setUsers(userData);
              }
              setCloudStatus("connected");
            } catch (err) {
              console.warn("Supabase fetch fallback:", err);
            }
          };
          fetchSupabase();
        }
      }, [cloudConfig.url, cloudConfig.anonKey]);

      useEffect(() => {
        localStorage.setItem("kindy_categories_v3", JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem("kindy_games_v3", JSON.stringify(games));
      }, [games]);

      useEffect(() => {
        localStorage.setItem("kindy_users_v3", JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem("kindy_current_user_v3", JSON.stringify(currentUser));
        } else {
          localStorage.removeItem("kindy_current_user_v3");
        }
      }, [currentUser]);

      const [currentView, setCurrentView] = useState(() => {
        if (!currentUser) return 'welcome';
        if (currentUser.role === 'ADMIN') return 'admin';
        if (currentUser.status === 'SUSPENDED') return 'suspended';
        return 'catalogue';
      });

      const [selectedCategoryId, setSelectedCategoryId] = useState(null);
      const [activeGame, setActiveGame] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");

      const [loginIdInput, setLoginIdInput] = useState("");
      const [loginPasswordInput, setLoginPasswordInput] = useState("");
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [showChangePassEye, setShowChangePassEye] = useState(false);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState("");

      const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
      const [newPersonalPassword, setNewPersonalPassword] = useState("");
      const [showTermsModal, setShowTermsModal] = useState(false);

      const [showChildProfilesModal, setShowChildProfilesModal] = useState(false);
      const [childFormMode, setChildFormMode] = useState('list');
      const [editingChildId, setEditingChildId] = useState(null);
      const [childNameInput, setChildNameInput] = useState("");
      const [childAvatarInput, setChildAvatarInput] = useState("star");

      const [adminTab, setAdminTab] = useState("categories");
      const [categoryModal, setCategoryModal] = useState({ open: false, editing: null });
      const [gameModal, setGameModal] = useState({ open: false, editing: null });
      const [confirmModal, setConfirmModal] = useState({ open: false, title: "", message: "", onConfirm: null, danger: false });

      const [createCustomerModal, setCreateCustomerModal] = useState(false);
      const [custFormName, setCustFormName] = useState("");
      const [custFormLoginId, setCustFormLoginId] = useState("");
      const [custFormPassword, setCustFormPassword] = useState("");
      const [custFormStatus, setCustFormStatus] = useState("ACTIVE");
      const [custFormMustChange, setCustFormMustChange] = useState(false);
      const [custFormError, setCustFormError] = useState("");

      const [slipModal, setSlipModal] = useState({ open: false, data: null });
      const [customerSearch, setCustomerSearch] = useState("");

      const [toast, setToast] = useState(null);
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const routeUser = (user) => {
        if (!user) {
          setCurrentView('welcome');
          setSelectedCategoryId(null);
          setActiveGame(null);
          return;
        }

        if (user.must_change_password) {
          setShowChangePasswordModal(true);
        }

        if (user.role === 'ADMIN') {
          setCurrentView('admin');
        } else if (user.status === 'SUSPENDED') {
          setCurrentView('suspended');
        } else if (user.status === 'ACTIVE') {
          setCurrentView('catalogue');
          setSelectedCategoryId(null);
          setActiveGame(null);
        } else {
          setCurrentView('welcome');
        }
      };

      const syncWithCloud = async (table, payload, method = "POST", matchCol = "id", matchVal = null) => {
        const activeUrl = (cloudConfig.url || SUPABASE_PROJECT_URL).trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const activeKey = (cloudConfig.anonKey || SUPABASE_PUBLISHABLE_KEY).trim();
        if (!activeUrl || !activeKey) return;

        try {
          let targetUrl = `${activeUrl}/rest/v1/${table}`;
          if (method === "PATCH" || method === "DELETE") {
            targetUrl += `?${matchCol}=eq.${encodeURIComponent(matchVal)}`;
          }

          const headers = {
            ...buildSupabaseHeaders(activeKey),
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          };

          const res = await fetch(targetUrl, {
            method: method,
            headers: headers,
            body: method !== "DELETE" ? JSON.stringify(payload) : undefined
          });
          if (!res.ok) console.warn(`Cloud sync warning for ${table}:`, await res.text());
        } catch (e) {
          console.warn(`Cloud sync error for ${table}:`, e);
        }
      };

      const handleUnifiedLogin = async (e) => {
        e.preventDefault();
        setLoginError("");
        setLoginLoading(true);

        const cleanLoginId = loginIdInput.trim().toLowerCase();

        try {
          if (cleanLoginId === CONFIG_ADMIN_LOGIN_ID.toLowerCase()) {
            if (loginPasswordInput === CONFIG_DEFAULT_ADMIN_PASS) {
              let adminUser = users.find(u => u.login_id.toLowerCase() === CONFIG_ADMIN_LOGIN_ID.toLowerCase());
              if (!adminUser) {
                const salt = "kk_salt_admin_default";
                const hash = await hashPassword(CONFIG_DEFAULT_ADMIN_PASS, salt);
                adminUser = {
                  id: "usr-admin-master",
                  login_id: CONFIG_ADMIN_LOGIN_ID,
                  display_name: "Portal Administrator",
                  salt: salt,
                  password_hash: hash,
                  role: "ADMIN",
                  status: "ACTIVE",
                  must_change_password: false,
                  child_profiles: [],
                  active_child_id: null,
                  created_at: new Date().toISOString()
                };
                setUsers(prev => [...prev.filter(u => u.login_id.toLowerCase() !== CONFIG_ADMIN_LOGIN_ID.toLowerCase()), adminUser]);
              }
              setCurrentUser(adminUser);
              setLoginIdInput("");
              setLoginPasswordInput("");
              routeUser(adminUser);
              showToast("Selamat kembali, Admin!");
              setLoginLoading(false);
              return;
            }
          }

          const matchedUser = users.find(u => u.login_id.toLowerCase() === cleanLoginId);

          if (!matchedUser) {
            setLoginError(t.invalidLogin);
            setLoginLoading(false);
            return;
          }

          const computedHash = await hashPassword(loginPasswordInput, matchedUser.salt);

          if (computedHash !== matchedUser.password_hash) {
            setLoginError(t.invalidLogin);
            setLoginLoading(false);
            return;
          }

          setCurrentUser(matchedUser);
          setLoginIdInput("");
          setLoginPasswordInput("");
          routeUser(matchedUser);
          showToast(`Welcome back, ${matchedUser.display_name}!`);
        } catch (err) {
          setLoginError(t.authError);
        } finally {
          setLoginLoading(false);
        }
      };

      const handleUpdatePersonalPassword = async (e) => {
        e.preventDefault();
        if (newPersonalPassword.length < 6) {
          showToast("Password must be at least 6 characters.", "error");
          return;
        }

        const newSalt = generateRandomSalt();
        const newHash = await hashPassword(newPersonalPassword, newSalt);

        const updatedUser = {
          ...currentUser,
          salt: newSalt,
          password_hash: newHash,
          must_change_password: false
        };

        setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
        setCurrentUser(updatedUser);
        setShowChangePasswordModal(false);
        setNewPersonalPassword("");

        syncWithCloud("profiles", {
          salt: newSalt,
          password_hash: newHash,
          must_change_password: false
        }, "PATCH", "id", updatedUser.id);

        showToast("Personal password set successfully! Enjoy Kindy Klub!");
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedCategoryId(null);
        setActiveGame(null);
        setCurrentView('welcome');
        setShowChildProfilesModal(false);
        showToast("Signed out safely.");
      };

      const currentActiveChild = useMemo(() => {
        if (!currentUser) return null;
        const list = currentUser.child_profiles || [];
        if (list.length === 0) {
          return {
            id: 'default',
            name: currentUser.display_name || 'Explorer',
            avatar: 'star'
          };
        }
        const active = list.find(c => c.id === currentUser.active_child_id);
        return active || list[0];
      }, [currentUser]);

      const handleSelectChild = (child) => {
        const updated = {
          ...currentUser,
          active_child_id: child.id
        };
        setCurrentUser(updated);
        setUsers(users.map(u => u.id === updated.id ? updated : u));
        syncWithCloud("profiles", { active_child_id: child.id }, "PATCH", "id", updated.id);
        setShowChildProfilesModal(false);
        showToast(lang === 'ms' ? `Selamat bermain, ${child.name}! ✨` : `Ready to play, ${child.name}! ✨`);
      };

      const handleOpenAddChild = () => {
        setChildFormMode('add');
        setEditingChildId(null);
        setChildNameInput("");
        setChildAvatarInput("star");
      };

      const handleOpenEditChild = (child, e) => {
        e.stopPropagation();
        setChildFormMode('edit');
        setEditingChildId(child.id);
        setChildNameInput(child.name);
        setChildAvatarInput(child.avatar || "star");
      };

      const handleSaveChildProfile = (e) => {
        e.preventDefault();
        const cleanName = childNameInput.trim();
        if (!cleanName) return;

        let profiles = Array.isArray(currentUser.child_profiles) ? [...currentUser.child_profiles] : [];
        let newActiveId = currentUser.active_child_id;

        if (childFormMode === 'edit' && editingChildId) {
          profiles = profiles.map(c => c.id === editingChildId ? { ...c, name: cleanName, avatar: childAvatarInput } : c);
        } else {
          const newId = `child-${Date.now()}`;
          const newKid = {
            id: newId,
            name: cleanName,
            avatar: childAvatarInput,
            created_at: new Date().toISOString()
          };
          profiles.push(newKid);
          newActiveId = newId;
        }

        const updatedUser = {
          ...currentUser,
          child_profiles: profiles,
          active_child_id: newActiveId || profiles[0]?.id
        };

        setCurrentUser(updatedUser);
        setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
        syncWithCloud("profiles", {
          child_profiles: profiles,
          active_child_id: updatedUser.active_child_id
        }, "PATCH", "id", updatedUser.id);

        setChildFormMode('list');
        showToast(lang === 'ms' ? "Profil si manja disimpan! 🌟" : "Child profile saved! 🌟");
      };

      const handleDeleteChildProfile = (childId, e) => {
        e.stopPropagation();
        const profiles = (currentUser.child_profiles || []).filter(c => c.id !== childId);
        const nextActive = profiles[0]?.id || null;

        const updatedUser = {
          ...currentUser,
          child_profiles: profiles,
          active_child_id: nextActive
        };

        setCurrentUser(updatedUser);
        setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
        syncWithCloud("profiles", {
          child_profiles: profiles,
          active_child_id: nextActive
        }, "PATCH", "id", updatedUser.id);

        showToast(lang === 'ms' ? "Profil dipadam." : "Profile removed.");
      };

      const handleSaveCategory = (catData) => {
        if (categoryModal.editing) {
          const updated = categories.map(c => c.id === categoryModal.editing.id ? { ...c, ...catData } : c);
          setCategories(updated);
          syncWithCloud("categories", catData, "PATCH", "id", categoryModal.editing.id);
          showToast("Category world updated.");
        } else {
          const newCat = {
            id: `cat-${Date.now()}`,
            ...catData,
            display_order: categories.length + 1
          };
          const updated = [...categories, newCat];
          setCategories(updated);
          syncWithCloud("categories", newCat, "POST");
          showToast("New category world created!");
        }
        setCategoryModal({ open: false, editing: null });
      };

      const handleDeleteCategory = (catId) => {
        const associatedGames = games.filter(g => g.category_id === catId);
        if (associatedGames.length > 0) {
          showToast(`Cannot delete: ${associatedGames.length} game(s) belong to this category. Delete or reassign those games first.`, "error");
          return;
        }

        const catToDelete = categories.find(c => c.id === catId);

        setConfirmModal({
          open: true,
          danger: true,
          title: "Delete Category?",
          message: `Are you sure you want to permanently delete "${catToDelete?.name || 'this category'}"? This action cannot be undone.`,
          onConfirm: () => {
            const updated = categories.filter(c => c.id !== catId);
            setCategories(updated);
            syncWithCloud("categories", null, "DELETE", "id", catId);
            setConfirmModal({ open: false, title: "", message: "", onConfirm: null, danger: false });
            showToast("Category permanently deleted.");
          }
        });
      };

      const handleSaveGame = (gameData) => {
        if (gameModal.editing) {
          const updated = games.map(g => g.id === gameModal.editing.id ? { ...g, ...gameData } : g);
          setGames(updated);
          syncWithCloud("games", gameData, "PATCH", "id", gameModal.editing.id);
          showToast("Game updated successfully.");
        } else {
          const newG = {
            id: `game-${Date.now()}`,
            ...gameData,
            is_published: true,
            display_order: games.length + 1
          };
          const updated = [...games, newG];
          setGames(updated);
          syncWithCloud("games", newG, "POST");
          showToast("New game published to kingdom!");
        }
        setGameModal({ open: false, editing: null });
      };

      const handleDeleteGame = (gameId) => {
        const gameToDelete = games.find(g => g.id === gameId);

        setConfirmModal({
          open: true,
          danger: true,
          title: "Delete Game?",
          message: `Are you sure you want to permanently delete "${gameToDelete?.title || 'this game'}"?`,
          onConfirm: () => {
            const updated = games.filter(g => g.id !== gameId);
            setGames(updated);
            syncWithCloud("games", null, "DELETE", "id", gameId);
            setConfirmModal({ open: false, title: "", message: "", onConfirm: null, danger: false });
            showToast("Game permanently deleted.");
          }
        });
      };

      const handleDownloadCatalogueJson = () => {
        const payload = {
          exported_at: new Date().toISOString(),
          app: "Kindy Klub",
          categories: categories,
          games: games
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "catalogue.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("Fail catalogue.json berjaya dimuat turun!");
      };

      const handleCopyCatalogueJson = () => {
        const payload = {
          exported_at: new Date().toISOString(),
          app: "Kindy Klub",
          categories: categories,
          games: games
        };
        navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
          showToast("Data JSON disalin ke clipboard!");
        }).catch(() => {
          showToast("Berjaya disalin.");
        });
      };

      const handleImportCatalogueFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed.categories)) setCategories(parsed.categories);
            if (Array.isArray(parsed.games)) setGames(parsed.games);
            showToast("Data catalogue.json berjaya diimport!");
          } catch (err) {
            showToast("Format fail JSON tidak sah.", "error");
          }
        };
        reader.readAsText(file);
      };

      const handlePurgeLegacyData = () => {
        setConfirmModal({
          open: true,
          danger: true,
          title: "Purge All Legacy Sample Data?",
          message: "This will remove any remaining sample categories or games from previous versions, leaving your catalogue clean and empty. Customer accounts will not be affected.",
          onConfirm: () => {
            const cleanCats = categories.filter(c => !LEGACY_SAMPLE_IDS.has(c.id));
            const cleanGms = games.filter(g => !LEGACY_SAMPLE_IDS.has(g.id));
            setCategories(cleanCats);
            setGames(cleanGms);
            localStorage.removeItem("kindy_categories_v2");
            localStorage.removeItem("kindy_games_v2");
            setConfirmModal({ open: false, title: "", message: "", onConfirm: null, danger: false });
            showToast("Catalogue cleaned! Sample data removed.");
          }
        });
      };

      const handleSaveCloudConfig = async (e) => {
        e.preventDefault();
        const form = e.target;
        const rawUrl = form.cloudUrl.value.trim();
        const key = form.cloudKey.value.trim();
        const url = rawUrl.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');

        if (!url || !key) {
          showToast("Sila masukkan Project URL dan Anon Key.", "error");
          return;
        }

        setCloudStatus("testing");
        try {
          const res = await fetch(`${url}/rest/v1/categories?select=id&limit=1`, {
            headers: buildSupabaseHeaders(key)
          });

          if (res.ok) {

        e.preventDefault();
        setCustFormError("");

        const cleanLoginId = custFormLoginId.trim().toLowerCase();

        if (!cleanLoginId) {
          setCustFormError("Login ID cannot be empty.");
          return;
        }

        if (cleanLoginId === CONFIG_ADMIN_LOGIN_ID.toLowerCase()) {
          setCustFormError(`"${CONFIG_ADMIN_LOGIN_ID}" is reserved for the Administrator.`);
          return;
        }

        if (users.some(u => u.login_id.toLowerCase() === cleanLoginId)) {
          setCustFormError(`Login ID "${cleanLoginId}" is already registered. Please choose another.`);
          return;
        }

        if (!custFormPassword || custFormPassword.length < 6) {
          setCustFormError("Password must be at least 6 characters long.");
          return;
        }

        const newSalt = generateRandomSalt();
        const newHash = await hashPassword(custFormPassword, newSalt);

        const newCustomer = {
          id: `usr-cust-${Date.now()}`,
          login_id: cleanLoginId,
          display_name: custFormName.trim() || "Kindy Explorer",
          salt: newSalt,
          password_hash: newHash,
          role: "CUSTOMER",
          status: custFormStatus,
          must_change_password: custFormMustChange,
          child_profiles: [],
          active_child_id: null,
          created_at: new Date().toISOString()
        };

        const updatedUsersList = [...users, newCustomer];
        setUsers(updatedUsersList);
        setCreateCustomerModal(false);

        syncWithCloud("profiles", newCustomer, "POST");

        setSlipModal({
          open: true,
          data: {
            name: newCustomer.display_name,
            loginId: newCustomer.login_id,
            password: custFormPassword

                  {t.slipSubtitle}
                </p>

                <div className="p-4 rounded-2xl bg-[#AEE9F3]/25 border-2 border-[#AEE9F3] text-left space-y-2 mb-5">
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-extrabold text-slate-500 uppercase">{t.slipNameLabel}</span>
                    <strong className="text-slate-800 text-xs">{slipModal.data.name}</strong>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-extrabold text-slate-500 uppercase">{t.slipLoginLabel}</span>
                    <strong className="text-[#FD60C7] font-mono text-sm">{slipModal.data.loginId}</strong>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-[11px] font-extrabold text-slate-500 uppercase">{t.slipPassLabel}</span>
                    <strong className="text-[#008f72] font-mono text-sm">{slipModal.data.password}</strong>
                  </div>
                </div>

                <div className="flex flex-col gap-2.5">
                  <a
                    href={`https://api.whatsapp.com/send?text=${encodeURIComponent(t.slipMsgCustomer(slipModal.data.loginId, slipModal.data.password))}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3.5 rounded-2xl bg-[#00c69e] hover:bg-[#008f72] text-white font-heading font-bold text-xs uppercase tracking-wider shadow-3d-teal transition flex items-center justify-center gap-2 group cursor-pointer"
                  >
                    <Icon name="whatsapp" className="w-5 h-5 group-hover:scale-110 transition-transform" />
                    <span>{t.slipSendWaBtn}</span>
                  </a>

                  <button
                    onClick={() => handleCopyWhatsAppMessage(slipModal.data)}
                    className="w-full py-2.5 rounded-2xl bg-[#AEE9F3]/40 hover:bg-[#AEE9F3] text-slate-800 font-heading font-bold text-xs uppercase tracking-wider transition flex items-center justify-center gap-2 border-2 border-[#07bdff]/30"
                  >
                    <Icon name="copy" className="w-4 h-4 text-[#07bdff]" />
                    <span>{t.slipCopyMsgBtn}</span>
                  </button>

                  <button
                    onClick={() => handleCopyCredentialsOnly(slipModal.data)}
                    className="w-full py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-heading font-bold text-xs transition flex items-center justify-center gap-2"
                  >
                    <Icon name="key" className="w-4 h-4 text-slate-500" />
                    <span>{t.slipCopyCredBtn}</span>
                  </button>

                  <button
                    onClick={() => setSlipModal({ open: false, data: null })}
                    className="w-full py-2 text-slate-400 hover:text-slate-600 font-heading font-bold text-xs mt-1"
                  >
                    {t.slipCloseBtn}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CHILD PROFILES MANAGEMENT MODAL */}
          {showChildProfilesModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[36px] max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-[#FD60C7] max-h-[90vh] flex flex-col animate-float" style={{ animationIterationCount: 1, animationDuration: '0.3s' }}>
                
                <div className="flex items-center justify-between pb-4 border-b-2 border-slate-100">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-[#FD60C7]/15 text-[#FD60C7] flex items-center justify-center">
                      <Icon name="family" className="w-6 h-6 text-[#FD60C7]" />
                    </div>
                    <div>
                      <h3 className="font-heading font-bold text-lg sm:text-xl text-slate-900">
                        {childFormMode === 'list' ? t.childProfilesTitle : (childFormMode === 'add' ? t.addChildBtn : t.editChildBtn)}
                      </h3>
                      <p className="text-[11px] sm:text-xs text-slate-500 font-bold">
                        {childFormMode === 'list' ? t.childProfilesSubtitle : t.childProfilesTitle}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowChildProfilesModal(false)}
                    className="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* MODE A: LIST OF CHILDREN */}
                {childFormMode === 'list' && (
                  <div className="py-4 overflow-y-auto space-y-3 pr-1 flex-1">
                    {(!currentUser?.child_profiles || currentUser.child_profiles.length === 0) ? (
                      <div className="p-6 rounded-2xl bg-[#AEE9F3]/20 border-2 border-[#AEE9F3] text-center space-y-3">
                        <div className="w-12 h-12 rounded-2xl bg-[#FD60C7] text-white flex items-center justify-center mx-auto shadow-md">
                          <Icon name="star" className="w-6 h-6" />
                        </div>
                        <div>
                          <h4 className="font-heading font-bold text-slate-800 text-sm">
                            {currentUser?.display_name || "Kindy Explorer"}
                          </h4>
                          <span className="text-[11px] font-bold text-[#00c69e] bg-[#00c69e]/15 px-2.5 py-0.5 rounded-full inline-block mt-1">
                            ● {t.activeProfile}
                          </span>
                        </div>
                        <p className="text-xs text-slate-500 font-bold">
                          {t.noChildYet}
                        </p>
                      </div>
                    ) : (
                      currentUser.child_profiles.map((child) => {
                        const isActive = currentActiveChild?.id === child.id;
                        const avatarMeta = CHILD_AVATARS.find(a => a.id === child.avatar) || CHILD_AVATARS[0];
                        return (
                          <div
                            key={child.id}
                            onClick={() => handleSelectChild(child)}
                            className={`group cursor-pointer flex items-center justify-between p-3.5 rounded-2xl border-3 transition-all ${
                              isActive
                                ? 'bg-gradient-to-r from-[#FD60C7]/15 via-white to-[#07bdff]/15 border-[#FD60C7] shadow-md scale-[1.01]'
                                : 'bg-slate-50 border-slate-200 hover:border-[#FD60C7]/50'
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-11 h-11 rounded-2xl flex items-center justify-center ${avatarMeta.bg} ${avatarMeta.text} shadow-sm border-2 ${avatarMeta.border}`}>
                                <Icon name={avatarMeta.icon} className="w-6 h-6" />
                              </div>
                              <div>
                                <h4 className="font-heading font-bold text-slate-900 text-sm sm:text-base leading-tight">
                                  {child.name}
                                </h4>
                                {isActive ? (
                                  <span className="text-[10px] font-extrabold text-[#008f72] flex items-center gap-1 mt-0.5">
                                    <Icon name="sparkles" className="w-3.5 h-3.5 text-[#00c69e]" />
                                    <span>{t.activeProfile}</span>
                                  </span>
                                ) : (
                                  <span className="text-[10px] font-bold text-slate-400 group-hover:text-[#FD60C7] transition">
                                    Klik untuk pilih ➔
                                  </span>
                                )}
                              </div>
                            </div>

                            <div className="flex items-center gap-1.5" onClick={(e) => e.stopPropagation()}>
                              <button
                                onClick={(e) => handleOpenEditChild(child, e)}
                                className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-[#AEE9F3] text-slate-600 hover:text-slate-900 flex items-center justify-center transition"
                                title={t.editChildBtn}
                              >
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button
                                onClick={(e) => handleDeleteChildProfile(child.id, e)}
                                className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-[#E9285F]/20 text-slate-400 hover:text-[#E9285F] flex items-center justify-center transition"
                                title={t.deleteChildBtn}
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}

                    <button
                      type="button"
                      onClick={handleOpenAddChild}
                      className="w-full mt-2 py-3.5 rounded-2xl bg-gradient-to-r from-[#FD60C7] via-[#a890ff] to-[#07bdff] text-white font-heading font-bold text-xs sm:text-sm uppercase tracking-wider shadow-3d-hotpink hover:opacity-95 transition flex items-center justify-center gap-2"
                    >
                      <Icon name="plus" className="w-4 h-4 text-white" />
                      <span>{t.addChildBtn}</span>
                    </button>
                  </div>
                )}

                {/* MODE B: ADD / EDIT CHILD FORM */}
                {(childFormMode === 'add' || childFormMode === 'edit') && (
                  <form onSubmit={handleSaveChildProfile} className="py-4 space-y-4 overflow-y-auto flex-1">
                    <div>
                      <label className="block text-xs font-extrabold uppercase text-slate-700 mb-1.5">
                        {t.childNameLabel}
                      </label>
                      <input
                        type="text"
                        required
                        value={childNameInput}
                        onChange={(e) => setChildNameInput(e.target.value)}
                        placeholder={lang === 'en' ? "e.g. Rayyan / Princess Ella / Umar" : "cth: Rayyan / Princess Ella / Umar"}
                        className="w-full px-4 py-3 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#FD60C7] focus:outline-none bg-slate-50"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold uppercase text-slate-700 mb-2">
                        {t.chooseAvatarLabel}
                      </label>
                      <div className="grid grid-cols-4 gap-2">
                        {CHILD_AVATARS.map((avatar) => {
                          const isSelected = childAvatarInput === avatar.id;
                          const avatarLabel = lang === 'en' ? avatar.label_en : avatar.label_ms;
                          return (
                            <button
                              key={avatar.id}
                              type="button"
                              onClick={() => setChildAvatarInput(avatar.id)}
                              className={`flex flex-col items-center justify-center py-2.5 px-1 rounded-2xl border-3 transition-all min-h-[72px] ${
                                isSelected
                                  ? `${avatar.bg} ${avatar.text} ${avatar.border} shadow-md scale-105`
                                  : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-slate-300'
                              }`}
                            >
                              <Icon name={avatar.icon} className="w-6 h-6 mb-1.5 flex-shrink-0" />
                              <span className="text-[11px] font-extrabold whitespace-nowrap text-center leading-none">
                                {avatarLabel}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="flex gap-2.5 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setChildFormMode('list')}
                        className="flex-1 py-3 rounded-2xl bg-slate-100 text-slate-700 font-heading font-bold text-xs uppercase"
                      >
                        {t.backToList}
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3 rounded-2xl bg-[#00c69e] hover:bg-[#008f72] text-white font-heading font-bold text-xs uppercase shadow-3d-teal"
                      >
                        {t.saveChildBtn}
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* CATEGORY ADD/EDIT MODAL */}
          {categoryModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[36px] max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-[#07bdff]">
                <div className="flex items-center justify-between mb-6">
                  <h3 className="font-heading font-bold text-xl text-slate-900">
                    {categoryModal.editing ? "Edit Category World" : "Create New World"}
                  </h3>
                  <button
                    onClick={() => setCategoryModal({ open: false, editing: null })}
                    className="p-1 rounded-xl text-slate-400 hover:bg-slate-100"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveCategory({
                      name: form.name.value,
                      description: form.description.value,
                      thumbnail_url: form.thumbnail_url.value,
                      display_order: parseInt(form.display_order.value || "1", 10)
                    });
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">World Name *</label>
                    <input
                      name="name"
                      required
                      defaultValue={categoryModal.editing?.name || ""}
                      placeholder="e.g. Science & Space"
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#07bdff] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Description</label>
                    <textarea
                      name="description"
                      rows="2"
                      defaultValue={categoryModal.editing?.description || ""}
                      placeholder="Brief overview..."
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#07bdff] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Square 1:1 Thumbnail URL *</label>
                    <input
                      name="thumbnail_url"
                      required
                      defaultValue={categoryModal.editing?.thumbnail_url || "https://images.unsplash.com/photo-1596495578065-6e0763fa1178?auto=format&fit=crop&w=600&h=600&q=80"}
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#07bdff] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Display Order</label>
                    <input
                      name="display_order"
                      type="number"
                      defaultValue={categoryModal.editing?.display_order || categories.length + 1}
                      className="w-28 px-4 py-2 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm"
                    />
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setCategoryModal({ open: false, editing: null })}
                      className="flex-1 py-3 rounded-2xl bg-slate-100 text-slate-700 font-heading font-bold text-sm"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 rounded-2xl bg-[#07bdff] hover:bg-[#028ec4] text-white font-heading font-bold text-sm shadow-3d-sky"
                    >
                      Save World
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* GAME ADD/EDIT MODAL */}
          {gameModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[36px] max-w-lg w-full p-6 sm:p-8 shadow-2xl border-4 border-[#ff68bd] max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-6">
                  <h3 className="font-heading font-bold text-xl text-slate-900">
                    {gameModal.editing ? "Edit Game" : "Add New Game"}
                  </h3>
                  <button
                    onClick={() => setGameModal({ open: false, editing: null })}
                    className="p-1 rounded-xl text-slate-400 hover:bg-slate-100"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveGame({
                      title: form.title.value,
                      category_id: form.category_id.value,
                      description: form.description.value,
                      source_type: form.source_type.value,
                      external_url: form.external_url?.value || "",
                      thumbnail_url: form.thumbnail_url.value,
                      html_content: form.html_content?.value || gameModal.editing?.html_content || "",
                      is_published: form.is_published.checked,
                    });
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Game Title *</label>
                    <input
                      name="title"
                      required
                      defaultValue={gameModal.editing?.title || ""}
                      placeholder="e.g. Kingdom Math Odyssey"
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#ff68bd] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Category World *</label>
                    <select
                      name="category_id"
                      required
                      defaultValue={gameModal.editing?.category_id || categories[0]?.id}
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#ff68bd] focus:outline-none"
                    >
                      {categories.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Description</label>
                    <textarea
                      name="description"
                      rows="2"
                      defaultValue={gameModal.editing?.description || ""}
                      placeholder="Game objective..."
                      className="w-full px-4 py-2 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#ff68bd] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold uppercase text-slate-600 mb-1">Square 1:1 Thumbnail URL *</label>
                    <input
                      name="thumbnail_url"
                      required
                      defaultValue={gameModal.editing?.thumbnail_url || "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=600&h=600&q=80"}
                      className="w-full px-4 py-2.5 rounded-2xl border-3 border-[#AEE9F3] font-bold text-sm focus:border-[#ff68bd] focus:outline-none"
                    />
                  </div>

                  <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 space-y-3">
                    <label className="block text-xs font-extrabold uppercase text-slate-700">Add Method</label>
                    <div className="flex flex-wrap gap-4">
                      <label className="flex items-center gap-2 cursor-pointer font-bold text-xs text-slate-700">
                        <input
                          type="radio"
                          name="source_type"
                          value="URL"
                          defaultChecked={gameModal.editing?.source_type !== 'HTML_UPLOAD' && gameModal.editing?.source_type !== 'BUILTIN_MATH'}
                          onChange={() => {
                            document.getElementById("form-url-block")?.classList.remove("hidden");
                            document.getElementById("form-html-block")?.classList.add("hidden");
                          }}
                        />
                        <span>Method A: URL</span>
                      </label>

                      <label className="flex items-center gap-2 cursor-pointer font-bold text-xs text-slate-700">
                        <input
                          type="radio"
                          name="source_type"
                          value="HTML_UPLOAD"
                          defaultChecked={gameModal.editing?.source_type === 'HTML_UPLOAD'}
                          onChange={() => {
                            document.getElementById("form-url-block")?.classList.add("hidden");
                            document.getElementById("form-html-block")?.classList.remove("hidden");
                          }}
                        />
                        <span>Method B: Standalone HTML</span>
                      </label>

                      <label className="flex items-center gap-2 cursor-pointer font-bold text-xs text-slate-700">
                        <input
                          type="radio"
                          name="source_type"
                          value="BUILTIN_MATH"
                          defaultChecked={gameModal.editing?.source_type === 'BUILTIN_MATH'}
                          onChange={() => {
                            document.getElementById("form-url-block")?.classList.add("hidden");
                            document.getElementById("form-html-block")?.classList.add("hidden");
                          }}
                        />
                        <span>Interactive: Kingdom Math</span>
                      </label>
                    </div>

                    <div id="form-url-block" className={gameModal.editing?.source_type === 'HTML_UPLOAD' || gameModal.editing?.source_type === 'BUILTIN_MATH' ? "hidden" : "block"}>
                      <input
                        name="external_url"
                        defaultValue={gameModal.editing?.external_url || ""}
                        placeholder="https://example.com/games/play"
                        className="w-full px-4 py-2 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none"
                      />
                    </div>

                    <div id="form-html-block" className={gameModal.editing?.source_type === 'HTML_UPLOAD' ? "block" : "hidden"}>
                      <textarea
                        name="html_content"
                        rows="3"
                        defaultValue={gameModal.editing?.html_content || ""}
                        placeholder="<!DOCTYPE html>... game code ..."
                        className="w-full px-4 py-2 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <input
                      type="checkbox"
                      id="is_published"
                      name="is_published"
                      defaultChecked={gameModal.editing ? gameModal.editing.is_published : true}
                      className="w-4 h-4 text-[#ff68bd] rounded"
                    />
                    <label htmlFor="is_published" className="text-xs font-extrabold text-slate-700">
                      Publish Live to Catalogue Immediately
                    </label>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setGameModal({ open: false, editing: null })}
                      className="flex-1 py-3 rounded-2xl bg-slate-100 text-slate-700 font-heading font-bold text-sm"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 rounded-2xl bg-[#ff68bd] hover:bg-[#d94695] text-white font-heading font-bold text-sm shadow-3d-pink"
                    >
                      Save Game
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* OFFICIAL FOOTER — Safe Area Aware */}
          {currentView !== 'player' && (
            <footer className="bg-white/90 backdrop-blur-md border-t-4 border-[#AEE9F3] py-6 ios-safe-bottom text-center mt-auto relative z-20">
              <p className="text-xs font-extrabold text-slate-400 tracking-wider">
                Kinder Klub | All Rights Reserved
              </p>
            </footer>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KindyKlubApp />);
  </script>
</body>
</html>
